<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cœurf — bezier curve editor</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="toolbar">
  <div class="brand">cœurf</div>

  <div class="tool-group">
    <button id="undo-btn" title="Undo (Ctrl+Z)">Undo</button>
    <button id="redo-btn" title="Redo (Ctrl+Shift+Z)">Redo</button>
  </div>

  <div class="tool-group">
    <button id="new-btn" title="Start a new, empty design">New</button>
    <button id="import-btn" title="Import design from a file">Import</button>
    <button id="download-btn" title="Download design as a file">Download</button>
    <input id="import-input" type="file" accept="application/json,.json" hidden>
  </div>

  <div class="tool-group" id="storage-group" hidden>
    <button id="open-btn" title="Open a design stored on the server">Open&hellip;</button>
    <button id="save-btn" title="Save as a new version on the server">Save</button>
    <button id="save-as-btn" title="Save as a new design on the server">Save as&hellip;</button>
    <span id="remote-label"></span>
  </div>

  <div class="tool-group">
    <button id="export-btn">Export SVG</button>
  </div>

  <div class="tool-group" id="zoom-group">
    <button id="zoom-out-btn" title="Zoom out (Ctrl/Cmd -)">&minus;</button>
    <button id="zoom-level-btn" title="Reset zoom (Ctrl/Cmd 0)">100%</button>
    <button id="zoom-in-btn" title="Zoom in (Ctrl/Cmd =)">+</button>
    <button id="zoom-fit-btn" title="Fit page to window">Fit</button>
  </div>
</header>

<main id="workspace">
  <aside id="tool-dock">
    <nav id="tool-buttons" role="group" aria-label="Tools">
      <button id="tool-page" class="tool-btn" data-tool="page" title="Page settings (P)">Page</button>
      <button id="tool-grid" class="tool-btn" data-tool="grid" title="Grid settings (G)">Grid</button>
      <button id="tool-palette" class="tool-btn" data-tool="palette" title="Palette (L)">Palette</button>
      <button id="tool-curve" class="tool-btn active" data-tool="curve" title="Curve tool (C)">Curve</button>
      <button id="tool-circle" class="tool-btn" data-tool="circle" title="Circle tool (O)">Circle</button>
      <button id="tool-symbol" class="tool-btn" data-tool="symbol" title="Symbol tool (S)">Symbol</button>
      <button id="tool-fill" class="tool-btn" data-tool="fill" title="Fill tool (F)">Fill</button>
    </nav>
    <div id="panel">
      <div class="panel-empty">Nothing selected.<br>Click an existing curve to select it, or click anywhere empty to draw one.</div>
    </div>
  </aside>
  <div id="canvas-scroll">
    <svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
</main>

<dialog id="open-dialog">
  <h2>Stored designs</h2>
  <ul id="design-list"></ul>
  <form method="dialog"><button>Close</button></form>
</dialog>

<div id="hint">Click a curve to select it, or click empty canvas (or an anchor) to start a new one.</div>

<script src="app.js"></script>
</body>
</html>
