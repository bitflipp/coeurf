<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cœurf — bezier grid editor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✳️</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="toolbar">
  <div class="brand">cœurf</div>

  <div class="tool-group">
    <button id="undo-btn" title="Undo (Ctrl+Z)">Undo</button>
    <button id="redo-btn" title="Redo (Ctrl+Shift+Z)">Redo</button>
  </div>

  <div class="tool-group">
    <button id="load-btn" title="Load from this browser (Ctrl+O)">Load</button>
    <button id="save-btn" title="Save to this browser (Ctrl+S)">Save</button>
  </div>

  <div class="tool-group">
    <button id="export-btn">Export SVG</button>
  </div>
</header>

<main id="workspace">
  <aside id="tool-dock">
    <nav id="tool-buttons" role="group" aria-label="Tools">
      <button id="tool-page" class="tool-btn" data-tool="page" title="Page settings (P)">Page</button>
      <button id="tool-grid" class="tool-btn" data-tool="grid" title="Grid settings (G)">Grid</button>
      <button id="tool-curve" class="tool-btn active" data-tool="curve" title="Curve tool (C)">Curve</button>
      <button id="tool-surface" class="tool-btn" data-tool="surface" title="Surface tool (S)">Surface</button>
    </nav>
    <div id="panel">
      <div class="panel-empty">Nothing selected.<br>Click an existing curve to select it, or click an empty grid point to draw one.</div>
    </div>
  </aside>
  <div id="canvas-scroll">
    <svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
</main>

<div id="hint">Click an existing curve to select it, or an empty grid point to draw a new one.</div>

<script src="app.js"></script>
</body>
</html>
